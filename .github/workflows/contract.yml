name: Contract

on:
  workflow_call:
    inputs:
      project-path:
        type: string
        default: .
  workflow_dispatch:
    inputs:
      project-path:
        type: string
        default: .

permissions:
  contents: read

jobs:
  contract:
    name: contract
    runs-on: ubuntu-latest
    env:
      PROJECT_PATH: ${{ inputs.project-path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate project path
        shell: bash
        run: python -c 'import os,pathlib; pathlib.Path(os.environ["PROJECT_PATH"]).resolve().relative_to(pathlib.Path.cwd().resolve())'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: pip
      - name: Install contract runtime
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pyproject.toml ]]; then
            python -m pip install -e '.[test]'
            python -m pip install -e '.[media]'
          else
            python -m pip install 'jsonschema>=4.26,<5' 'Pillow==12.3.0' 'numpy==2.4.6' 'hypothesis==6.156.4'
            echo "PYTHONPATH=$GITHUB_WORKSPACE/$PROJECT_PATH/.aigame/vendor" >> "$GITHUB_ENV"
          fi
      - name: Run contract suite
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pyproject.toml ]]; then
            python -m unittest discover -s tests -v
            temporary="$(mktemp -d)"
            aigame new "CI Fixture" --destination "$temporary/game" --godot-version 4.7 --apply --json
            aigame validate --project "$temporary/game" --json
          else
            python -m aigame validate --project "$PROJECT_PATH" --json
          fi
