name: Contract

on:
  workflow_call:
    inputs:
      project-path:
        type: string
        default: .
  workflow_dispatch:
    inputs:
      project-path:
        type: string
        default: .

permissions:
  contents: read

jobs:
  contract:
    name: contract
    runs-on: ubuntu-latest
    env:
      PROJECT_PATH: ${{ inputs.project-path }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Validate project path
        shell: bash
        run: python -c 'import os,pathlib; pathlib.Path(os.environ["PROJECT_PATH"]).resolve().relative_to(pathlib.Path.cwd().resolve())'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: pip
      - name: Install contract runtime
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pyproject.toml ]]; then
            python -m pip install -e '.[test]'
          else
            python -m pip install 'jsonschema>=4.26,<5'
            echo "PYTHONPATH=$GITHUB_WORKSPACE/$PROJECT_PATH/.aigame/vendor" >> "$GITHUB_ENV"
          fi
      - name: Run contract suite
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pyproject.toml ]]; then
            python -m unittest discover -s tests -v
            temporary="$(mktemp -d)"
            aigame new "CI Fixture" --destination "$temporary/game" --godot-version 4.7 --apply --json
            aigame validate --project "$temporary/game" --json
          else
            python -m aigame validate --project "$PROJECT_PATH" --json
          fi
