name: GitHub Sync

on:
  workflow_call:
    inputs:
      project-path:
        type: string
        default: .

permissions:
  contents: read
  issues: write

jobs:
  github-sync:
    runs-on: ubuntu-latest
    env:
      PROJECT_PATH: ${{ inputs.project-path }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Validate project path
        shell: bash
        run: python -c 'import os,pathlib; pathlib.Path(os.environ["PROJECT_PATH"]).resolve().relative_to(pathlib.Path.cwd().resolve())'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Mirror canonical work items
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python -m pip install 'jsonschema>=4.26,<5'
          PYTHONPATH="$PROJECT_PATH/.aigame/vendor" python -m aigame sync github --project "$PROJECT_PATH" --apply --json
