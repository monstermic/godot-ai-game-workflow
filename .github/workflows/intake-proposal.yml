name: Intake Proposal

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  intake-proposal:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Convert untrusted issue text into a data-only proposal PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const issue = context.payload.issue;
            const base = context.payload.repository.default_branch;
            const baseRef = await github.rest.git.getRef({
              owner: context.repo.owner, repo: context.repo.repo, ref: `heads/${base}`
            });
            const branch = `intake/GH-${issue.number}`;
            await github.rest.git.createRef({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: `refs/heads/${branch}`, sha: baseRef.data.object.sha
            });
            const path = `work/intake/GH-${String(issue.number).padStart(4, '0')}.json`;
            const content = Buffer.from(JSON.stringify({
              schema_version: '1.0', source: 'github_issue', issue_number: issue.number,
              status: 'draft', title: issue.title, body: issue.body || '',
              author: issue.user.login, source_url: issue.html_url
            }, null, 2) + '\n').toString('base64');
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo, path,
              message: `Capture intake from GH-${issue.number}`,
              content, branch
            });
            await github.rest.pulls.create({
              owner: context.repo.owner, repo: context.repo.repo,
              head: branch, base,
              title: `[Intake GH-${issue.number}] ${issue.title}`,
              body: `Data-only proposal generated from #${issue.number}. Review and convert it into canonical requirements before merging.`,
              draft: true
            });
